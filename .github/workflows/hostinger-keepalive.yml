# Keep Hostinger Node awake — managed apps sleep after idle (~10s cold start).
name: Keep Hostinger warm

on:
  schedule:
    # GitHub schedules often drift; ping often enough to reduce cold starts.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: hostinger-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Warm HTML + LCP assets
        run: |
          set -euo pipefail
          BASE="https://www.argroupofeducation.com"
          for path in \
            "/" \
            "/hero-banner-aug4-640.webp" \
            "/hero-banner-aug4.webp" \
            "/ar-group-logo.webp" \
            "/favicon.ico"
          do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 50 "${BASE}${path}" || echo "000")
            echo "${path} -> ${code}"
          done
