FAQs:</strong></h2><p>						<style>
				<div class="wp-premium-faq-group wp-premium-faq-group--animated"><details class="wp-premium-faq" style="--faq-i:0"><summary class="wp-premium-faq-summary"><span class="wp-premium-faq-qnum">01</span><span class="wp-premium-faq-qtext">What is Kathmandu University School of Medical Sciences (KUSMS)?</span></summary><div class="wp-premium-faq-body"><div class="wp-premium-faq-body-inner">Kathmandu University School of Medical Sciences (KUSMS) is a renowned medical institution located in Dhulikhel, Nepal. It is affiliated with Kathmandu University and offers various undergraduate and postgraduate medical programs.</div></div></details><details class="wp-premium-faq" style="--faq-i:1"><summary class="wp-premium-faq-summary"><span class="wp-premium-faq-qnum">02</span><span class="wp-premium-faq-qtext">What programs are offered at Kathmandu University School of Medical Sciences?</span></summary><div class="wp-premium-faq-body"><div class="wp-premium-faq-body-inner">KUSMS offers a wide range of programs in the field of medical and health sciences. These include MBBS (Bachelor of Medicine, Bachelor of Surgery), MD/MS programs, Bachelor of Nursing (BN), and various other health-related courses.</div></div></details><details class="wp-premium-faq" style="--faq-i:2"><summary class="wp-premium-faq-summary"><span class="wp-premium-faq-qnum">03</span><span class="wp-premium-faq-qtext">Is Kathmandu University School of Medical Sciences recognized nationally and internationally?</span></summary><div class="wp-premium-faq-body"><div class="wp-premium-faq-body-inner">Yes, KUSMS is recognized by the Nepal Medical Council (NMC) and other relevant authorities in Nepal. It also holds international recognition, and its degrees are accepted worldwide, making it a preferred choice for medical education.</div></div></details><details class="wp-premium-faq" style="--faq-i:3"><summary class="wp-premium-faq-summary"><span class="wp-premium-faq-qnum">04</span><span class="wp-premium-faq-qtext">What is the campus and facilities like at Kathmandu University School of Medical Sciences?</span></summary><div class="wp-premium-faq-body"><div class="wp-premium-faq-body-inner">The KUSMS campus is situated in a picturesque location in Dhulikhel, offering a serene and conducive environment for learning. The campus is equipped with modern facilities, including well-equipped labs, libraries, student accommodations, and teaching hospitals for practical training.</div></div></details></div>	</p>								</div>
