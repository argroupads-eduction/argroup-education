version: 1
applications:
  - appRoot: apps/frontend
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm ci
            - npm run db:generate --prefix apps/backend
        build:
          commands:
            # Amplify console env vars are NOT available to Next.js SSR at runtime unless
            # written into .env.production during build (AWS docs: ssr-environment-variables).
            - touch apps/frontend/.env.production
            - env | grep -E '^(DATABASE_URL|GOOGLE_SHEETS_WEBHOOK_URL|GOOGLE_SHEETS_WEBHOOK_SECRET|LEADS_NOTIFY_EMAIL|SMTP_HOST|SMTP_PORT|SMTP_USER|SMTP_PASS|SMTP_FROM|EMAIL_OTP_FROM|EMAIL_OTP_SECRET|PAYLOAD_CMS_ENABLED|PAYLOAD_SYNC_SECRET|REVALIDATE_SECRET|PUSH_NOTIFY_SECRET|NEXT_PUBLIC_SITE_URL|NEXT_PUBLIC_SITE_NAME|NEXT_PUBLIC_VAPID_PUBLIC_KEY|VAPID_PUBLIC_KEY|VAPID_PRIVATE_KEY|VAPID_SUBJECT|CRON_SECRET|YOUTUBE_API_KEY|YOUTUBE_CHANNEL_HANDLE|YOUTUBE_CHANNEL_ID|YOUTUBE_FEED_REFRESH_SECONDS|GOOGLE_MAPS_API_KEY|GOOGLE_PLACE_ID|GOOGLE_PLACE_QUERY|WP_MEDIA_ORIGIN)=' >> apps/frontend/.env.production || true
            - npm run build --workspace=ar-education-frontend
        postBuild:
          commands:
            # Amplify artifact limit is ~220MB — drop webpack cache and oversized traced folders.
            - rm -rf apps/frontend/.next/cache
            - find apps/frontend/.next -type d -name wp-content -prune -exec rm -rf {} + 2>/dev/null || true
            - find apps/frontend/.next -name "*.map" -delete 2>/dev/null || true
            - du -sh apps/frontend/.next || true
      artifacts:
        baseDirectory: apps/frontend/.next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/frontend/.next/cache/**/*
